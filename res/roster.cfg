# 2048civ — Unit Roster Configuration
# Format per entry:
#   [character]
#   name        = display name
#   job         = job class string
#   faction     = player | enemy
#   idle_sprite = sprite name in atlas desc (idle animation)
#   run_sprite  = sprite name in atlas desc (run animation)
#   run_frames  = number of run animation frames (default 4)
#   hp_base     = base max HP
#   hp_rand     = random bonus added to hp_base
#   atk_base    = base attack
#   atk_rand    = random bonus
#   def_base    = base defense
#   def_rand    = random bonus
#   move        = movement range (hex steps)

# ── Player-faction characters ──────────────────────────────────────────────

[character]
name        = Knight
job         = Knight
faction     = player
idle_sprite = knight_f_idle_anim
run_sprite  = knight_f_run_anim
run_frames  = 4
hp_base     = 100
hp_rand     = 60
atk_base    = 12
atk_rand    = 8
def_base    = 6
def_rand    = 4
move        = 3

